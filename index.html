<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сканер штрихкода</title>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.2/dist/quagga.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;color:#fff}
        #scanner-container{width:100%;height:70vh}
        video{width:100%;height:100%;object-fit:cover}
        .controls{margin:20px;text-align:center}
        button{padding:15px 40px;font-size:18px;font-weight:bold;background:#4f46e5;color:white;border:none;border-radius:10px;cursor:pointer;margin:0 10px}
        button.stop{background:#ef4444}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 24px;border-radius:30px;font-weight:bold;display:none;z-index:1000}
        .toast.show{display:block}
    </style>
</head>
<body>
    <div id="scanner-container"></div>
    <div class="toast" id="toast">✅ Скопировано!</div>
    <div class="controls">
        <button id="start-btn" onclick="toggleScanner()">▶ Начать сканирование</button>
    </div>
    <script>
        let scannerActive=false;
        const btn=document.getElementById('start-btn');
        const toast=document.getElementById('toast');
        
        function showToast(msg){
            toast.textContent=msg;toast.classList.add('show');
            setTimeout(function(){toast.classList.remove('show')},2500);
        }
        
        function onDetected(code){
            if(navigator.clipboard&&navigator.clipboard.writeText){
                navigator.clipboard.writeText(code).then(function(){
                    showToast('✅ '+code+' скопирован!');
                });
            }
            if(window.parent&&window.parent!==window){
                window.parent.postMessage({type:'BARCODE_RESULT',code:code},'*');
            }
            stopScanner();
        }
        
        function stopScanner(){
            if(scannerActive){Quagga.stop();scannerActive=false}
            btn.textContent='▶ Начать сканирование';btn.classList.remove('stop');
        }
        
        function toggleScanner(){
            if(scannerActive){stopScanner();return}
            navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){
                stream.getTracks().forEach(function(t){t.stop()});
                Quagga.init({
                    inputStream:{name:'Live',type:'LiveStream',target:document.getElementById('scanner-container'),constraints:{facingMode:'environment'}},
                    decoder:{readers:['ean_reader','ean_8_reader','code_128_reader','code_39_reader','upc_reader','upc_e_reader']},
                    locate:true
                },function(err){
                    if(err){alert('Ошибка камеры');return}
                    Quagga.start();scannerActive=true;
                    btn.textContent='⏹ Остановить';btn.classList.add('stop');
                });
                Quagga.onDetected(function(r){if(r&&r.codeResult&&r.codeResult.code)onDetected(r.codeResult.code)});
            }).catch(function(){alert('Нет доступа к камере')});
        }
    </script>
</body>
</html>
