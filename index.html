<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сканер штрихкодов</title>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.2/dist/quagga.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #6b7280;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --border: #e5e7eb;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .scanner-widget {
            width: 100%;
            max-width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header {
            text-align: center;
        }

        .header h2 {
            font-size: 14px;
            font-weight: 650;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.3px;
        }

        .viewport {
            position: relative;
            width: 100%;
            height: 100px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #scanner-container {
            width: 100%;
            height: 100%;
        }

        #scanner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .viewport-placeholder {
            color: #6b7280;
            text-align: center;
            font-size: 11px;
            position: absolute;
            pointer-events: none;
        }

        .scan-region-highlight {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4f46e5, #818cf8, #4f46e5, transparent);
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.6);
            animation: scanPulse 2s ease-in-out infinite;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        @keyframes scanPulse {
            0%, 100% { transform: translateY(-10px); opacity: 0.6; }
            50% { transform: translateY(10px); opacity: 1; }
        }

        #barcode-input {
            width: 100%;
            padding: 6px 10px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            text-align: center;
            letter-spacing: 1px;
            background: #f9fafb;
            color: var(--text);
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            flex: 1;
            padding: 7px 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 1.5px solid #fecaca;
        }

        .btn-danger:hover {
            background: #fef2f2;
        }

        .btn-outline {
            background: #fff;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-outline:hover {
            background: #f9fafb;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .toast {
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .toast.success {
            background: #ecfdf5;
            color: #065f46;
            display: block;
        }

        .toast.error {
            background: #fef2f2;
            color: #991b1b;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scan-counter {
            position: absolute;
            bottom: 4px;
            right: 6px;
            background: rgba(79, 70, 229, 0.9);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            z-index: 20;
            display: none;
        }

        .scan-counter.confirmed {
            background: rgba(16, 185, 129, 0.9);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="scanner-widget">
        <div class="header">
            <h2>📷 Сканер штрихкодов</h2>
        </div>

        <div class="viewport" id="viewport">
            <div id="scanner-container"></div>
            <div class="viewport-placeholder" id="placeholder">Камера не активна</div>
            <div class="scan-region-highlight" id="scan-line"></div>
            <div class="scan-counter" id="scan-counter"></div>
        </div>

        <input type="text" id="barcode-input" placeholder="Штрихкод появится здесь" readonly>

        <div class="toast" id="toast"></div>

        <div class="actions">
            <button class="btn btn-primary" id="start-btn">▶ Старт</button>
            <button class="btn btn-danger" id="stop-btn" disabled>⏹ Стоп</button>
            <button class="btn btn-outline" id="copy-btn" disabled>📋 Копировать</button>
        </div>
    </div>

    <script>
        (function() {
            const scannerContainer = document.getElementById('scanner-container');
            const placeholder = document.getElementById('placeholder');
            const scanLine = document.getElementById('scan-line');
            const scanCounter = document.getElementById('scan-counter');
            const barcodeInput = document.getElementById('barcode-input');
            const toast = document.getElementById('toast');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const copyBtn = document.getElementById('copy-btn');

            let scannerActive = false;
            let detectionCounts = {};
            let lastDetectedTime = {};
            const CONFIRMATION_THRESHOLD = 3;
            const DETECTION_DELAY = 300; // 0.3 секунды между подтверждениями

            function showToast(message, type) {
                toast.textContent = message;
                toast.className = 'toast ' + (type || 'success');
                setTimeout(function() {
                    toast.className = 'toast';
                }, 3000);
            }

            function updateUIForActive(active) {
                scannerActive = active;
                if (active) {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    scanLine.style.display = 'block';
                    placeholder.style.display = 'none';
                    startBtn.textContent = '⏳ Скан...';
                } else {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    scanLine.style.display = 'none';
                    placeholder.style.display = 'block';
                    startBtn.textContent = '▶ Старт';
                    scanCounter.style.display = 'none';
                    scanCounter.classList.remove('confirmed');
                }
            }

            function resetDetection() {
                detectionCounts = {};
                lastDetectedTime = {};
                scanCounter.style.display = 'none';
                scanCounter.classList.remove('confirmed');
            }

            function updateCounterDisplay(count) {
                if (count > 0 && count < CONFIRMATION_THRESHOLD) {
                    scanCounter.style.display = 'block';
                    scanCounter.classList.remove('confirmed');
                    scanCounter.textContent = '🔍 ' + count + '/' + CONFIRMATION_THRESHOLD;
                } else if (count >= CONFIRMATION_THRESHOLD) {
                    scanCounter.style.display = 'block';
                    scanCounter.classList.add('confirmed');
                    scanCounter.textContent = '✅ Готово!';
                } else {
                    scanCounter.style.display = 'none';
                    scanCounter.classList.remove('confirmed');
                }
            }

            // Надёжная функция копирования для всех устройств
            function copyToClipboard(text, callback) {
                // Способ 1: Современный API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        if (callback) callback(true);
                    }).catch(function() {
                        fallbackCopy(text, callback);
                    });
                } else {
                    // Способ 2: Фолбэк
                    fallbackCopy(text, callback);
                }
            }

            function fallbackCopy(text, callback) {
                var input = document.createElement('input');
                input.type = 'text';
                input.value = text;
                input.style.position = 'fixed';
                input.style.top = '0';
                input.style.left = '0';
                input.style.width = '2em';
                input.style.height = '2em';
                input.style.padding = '0';
                input.style.border = 'none';
                input.style.outline = 'none';
                input.style.boxShadow = 'none';
                input.style.background = 'transparent';
                input.style.fontSize = '16px';
                input.style.color = 'transparent';
                input.style.opacity = '0';
                input.style.pointerEvents = 'none';
                input.style.zIndex = '-1';
                
                document.body.appendChild(input);
                
                input.focus();
                input.select();
                input.setSelectionRange(0, 9999);
                
                var success = false;
                try {
                    success = document.execCommand('copy');
                } catch(e) {
                    console.error('Фолбэк копирования не сработал:', e);
                }
                
                document.body.removeChild(input);
                
                if (callback) callback(success);
            }

            function onCodeConfirmed(code) {
                barcodeInput.value = code;
                copyBtn.disabled = false;
                
                // Автоматическое копирование
                copyToClipboard(code, function(success) {
                    if (success) {
                        showToast('✅ ' + code + ' — скопирован!', 'success');
                    } else {
                        showToast('⚠ Штрихкод: ' + code + '. Нажмите Копировать', 'error');
                    }
                });
                
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate([100, 50, 100]); // Двойная вибрация при подтверждении
                }
                
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({type: 'BARCODE_RESULT', code: code}, '*');
                }
                
                stopScanner();
            }

            function stopScanner() {
                if (scannerActive) {
                    try {
                        Quagga.stop();
                    } catch(e) {}
                    
                    var video = scannerContainer.querySelector('video');
                    if (video && video.srcObject) {
                        video.srcObject.getTracks().forEach(function(t) { t.stop(); });
                    }
                    scannerContainer.innerHTML = '';
                    updateUIForActive(false);
                    resetDetection();
                }
            }

            function startScanner() {
                if (scannerActive) return;
                stopScanner();
                
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('❌ Камера не поддерживается', 'error');
                    return;
                }

                navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                }).then(function(tempStream) {
                    tempStream.getTracks().forEach(function(t) { t.stop(); });
                    
                    Quagga.init({
                        inputStream: {
                            name: 'Live',
                            type: 'LiveStream',
                            target: scannerContainer,
                            constraints: {
                                facingMode: 'environment',
                                width: { min: 320, ideal: 640, max: 800 },
                                height: { min: 240, ideal: 480, max: 600 }
                            }
                        },
                        locator: { halfSample: false, patchSize: 'large' },
                        numOfWorkers: 0,
                        decoder: {
                            readers: ['ean_reader','ean_8_reader','code_128_reader','code_39_reader','upc_reader','upc_e_reader']
                        },
                        locate: true,
                        multiple: false
                    }, function(err) {
                        if (err) {
                            showToast('❌ Ошибка камеры', 'error');
                            stopScanner();
                            return;
                        }
                        Quagga.start();
                        updateUIForActive(true);
                        resetDetection();
                        
                        Quagga.onDetected(function(result) {
                            if (!result || !result.codeResult || !result.codeResult.code) return;
                            if (!scannerActive) return;
                            
                            var code = result.codeResult.code;
                            var now = Date.now();
                            
                            // Проверка задержки между срабатываниями (0.3 секунды)
                            if (lastDetectedTime[code] && (now - lastDetectedTime[code] < DETECTION_DELAY)) {
                                return; // Ещё рано, пропускаем
                            }
                            
                            lastDetectedTime[code] = now;
                            detectionCounts[code] = (detectionCounts[code] || 0) + 1;
                            
                            updateCounterDisplay(detectionCounts[code]);
                            
                            if (detectionCounts[code] >= CONFIRMATION_THRESHOLD) {
                                // Задержка перед подтверждением для анимации
                                setTimeout(function() {
                                    if (scannerActive) {
                                        onCodeConfirmed(code);
                                    }
                                }, 200);
                            }
                        });
                    });
                }).catch(function() {
                    showToast('❌ Нет доступа к камере', 'error');
                });
            }

            startBtn.addEventListener('click', startScanner);
            stopBtn.addEventListener('click', stopScanner);
            
            copyBtn.addEventListener('click', function() {
                var code = barcodeInput.value;
                if (!code) return;
                
                copyToClipboard(code, function(success) {
                    if (success) {
                        var origText = copyBtn.textContent;
                        copyBtn.textContent = '✅ Скопировано!';
                        copyBtn.style.background = '#ecfdf5';
                        copyBtn.style.color = '#065f46';
                        copyBtn.style.borderColor = '#a7f3d0';
                        setTimeout(function() {
                            copyBtn.textContent = origText;
                            copyBtn.style.background = '#fff';
                            copyBtn.style.color = '#1a1a1a';
                            copyBtn.style.borderColor = '#e5e7eb';
                        }, 1500);
                    } else {
                        showToast('❌ Не удалось скопировать', 'error');
                    }
                });
            });

            window.addEventListener('beforeunload', function() {
                if (scannerActive) stopScanner();
            });
        })();
    </script>
</body>
</html>
