<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VK Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 20px; }
        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { color: white; font-size: 16px; margin-top: 20px; }
        .error { background: rgba(255,255,255,0.95); color: #e74c3c; padding: 20px; border-radius: 12px; max-width: 300px; }
        button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loader"></div>
        <div class="status" id="statusText">Подключение к ВКонтакте...</div>
    </div>

    <script src="https://unpkg.com/@vkontakte/vk-bridge@2.0.3/dist/browser.min.js"></script>
    
    <script>
        const TARGET_URL = 'https://alcorosal.ru/admin';
        let initAttempts = 0;
        const MAX_ATTEMPTS = 3;
        
        function updateStatus(message) {
            const statusEl = document.getElementById('statusText');
            if (statusEl) statusEl.textContent = message;
            console.log(message);
        }
        
        function showError(message) {
            const container = document.getElementById('app');
            container.innerHTML = `
                <div class="error">
                    <h3>❌ Ошибка</h3>
                    <p>${message}</p>
                    <button onclick="location.reload()">🔄 Повторить</button>
                </div>
            `;
        }
        
        function redirectToApp() {
            updateStatus('Перенаправление...');
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 100);
        }
        
        function initVKApp() {
            updateStatus('Инициализация VK Bridge...');
            
            // Проверяем наличие VK Bridge
            if (typeof window.vkBridge === 'undefined') {
                if (initAttempts < MAX_ATTEMPTS) {
                    initAttempts++;
                    updateStatus(`Ожидание VK Bridge (попытка ${initAttempts}/${MAX_ATTEMPTS})...`);
                    setTimeout(initVKApp, 500);
                    return;
                }
                showError('Не удалось загрузить VK Bridge. Проверьте интернет-соединение.');
                return;
            }
            
            updateStatus('Отправка сигнала VK...');
            
            // Отправляем сигнал инициализации с таймаутом
            Promise.race([
                window.vkBridge.send('VKWebAppInit'),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 3000))
            ])
            .then(() => {
                updateStatus('VK инициализирован, получаем данные...');
                return window.vkBridge.send('VKWebAppGetUserInfo');
            })
            .then((userInfo) => {
                if (userInfo && userInfo.first_name) {
                    updateStatus(`Привет, ${userInfo.first_name}!`);
                }
                // Успешно - перенаправляем
                redirectToApp();
            })
            .catch((error) => {
                console.error('VK Init Error:', error);
                // Пробуем ещё раз
                if (initAttempts < MAX_ATTEMPTS) {
                    initAttempts++;
                    updateStatus(`Повторная попытка (${initAttempts}/${MAX_ATTEMPTS})...`);
                    setTimeout(initVKApp, 1000);
                } else {
                    // Если не получилось, но приложение внутри VK - пробуем перенаправить всё равно
                    if (window.location !== window.parent.location) {
                        updateStatus('Перенаправление без VK...');
                        redirectToApp();
                    } else {
                        showError('Не удалось инициализировать VK. Попробуйте обновить страницу.');
                    }
                }
            });
        }
        
        // Запускаем после полной загрузки
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVKApp);
        } else {
            initVKApp();
        }
    </script>
</body>
</html>
